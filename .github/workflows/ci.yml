# The mocked end-to-end checks in headless Chrome, with stand-ins for Word and Excel. Never calls api.p3n.si.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The tests need only puppeteer-core; no install scripts run.
      - name: Install dev tools
        run: npm ci --ignore-scripts

      # The runner's own Chrome. CI is set, so it runs without its sandbox.
      - name: End-to-end (mocked API)
        run: CHROME="$(command -v google-chrome)" node dev/e2e.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: dev/out/*.png
          if-no-files-found: warn
