<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The front page of the add-in's host. Office never opens it; it's for people who land here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>p3n for Word and Excel</title>
  <link rel="icon" href="assets/icon-32.png">
  <link rel="stylesheet" href="ui/base.css">
  <link rel="stylesheet" href="ui/pane.css">
  <script src="ui/theme.js"></script>
</head>
<body class="site">
  <main class="stack">
    <img src="assets/icon-128.png" width="64" height="64" alt="">
    <h1>p3n for Word and Excel</h1>
    <p>This site hosts the task pane of the p3n add-in, which checks selected text for AI and rewrites it. Office loads it from here when you open p3n.</p>
    <p>To install the add-in, see <a href="https://github.com/Barabosik/p3n-office-addin#install">the instructions on GitHub</a>, which use <a href="manifest.xml">manifest.xml</a>. More about p3n at <a href="https://p3n.si">p3n.si</a>.</p>
  </main>
</body>
</html>
